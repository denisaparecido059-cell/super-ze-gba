name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH
          arm-none-eabi-gcc -specs=gba.specs -mthumb -mthumb-interwork -O2 main.c -o game.elf
          arm-none-eabi-objcopy -O binary game.elf super-ze.gba
          gbafix super-ze.gba
      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: super-ze.gba
